
<!-- filename: index.html -->

<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skogsmarkören</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#059669">
    


    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- JS -->
    <script type="module" src="js/app.js"></script>    
    
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #map {
            height: 100%;
            width: 100%;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-800 flex flex-col h-screen overflow-hidden">

<!-- Header -->
<!-- Top Header med CSS Grid och Hamburgermeny -->
<header class="grid grid-cols-3 items-center px-4 py-2.5 bg-white border-b border-slate-200 sticky top-0 z-[2000]">
  
  <!-- Vänster: GPS Badge (Ligger bergfast till vänster) -->
  <div class="justify-self-start">
    <span class="inline-flex items-center gap-1.5 bg-slate-100 text-slate-700 px-3 py-1 rounded-full text-xs font-semibold border border-slate-200/80 shadow-sm">
      <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
      <span id="gps-accuracy-badge">±--m</span>
    </span>
  </div>

  <!-- Mitten: Logotyp (Ligger garanterat exakt i mitten) -->
  <div class="justify-self-center flex items-center gap-2">
    <div class="w-8 h-8 rounded-full bg-emerald-100 flex items-center justify-center text-lg shadow-inner">
      🍄
    </div>
    <div class="text-left">
      <h1 class="font-bold text-slate-900 text-sm leading-none">Skogsmarkören</h1>
      <p class="text-[10px] text-slate-400 font-medium leading-tight mt-0.5">GPS & Kartbok</p>
    </div>
  </div>

  <!-- Höger: Hamburgermeny (Subtil och framtidssäker) -->
  <div class="justify-self-end relative">
    <button id="btn-hamburger" class="w-9 h-9 flex items-center justify-center rounded-xl bg-slate-50 border border-slate-200 text-slate-700 hover:bg-slate-100 active:scale-95 transition">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>

    <!-- Dropdown-meny -->
    <div id="hamburger-menu" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-2xl shadow-xl border border-slate-100 py-1.5 z-[3000]">
      <a href="https://earth.google.com/web/" target="_blank" class="flex items-center gap-2 px-4 py-2 text-xs font-semibold text-slate-700 hover:bg-emerald-50 hover:text-emerald-800 transition">
        <span>🌐</span> Google Earth 3D
      </a>
      <hr class="my-1 border-slate-100">
      <div class="px-4 py-1.5 text-[10px] text-slate-400 font-medium">
        Skogsmarkören v1.0
      </div>
    </div>
  </div>

</header>



<!-- Controls -->
<!-- Flikväljare & Åtgärder -->
<div class="px-4 py-2 bg-slate-100/70 border-b border-slate-200 flex items-center justify-between gap-2">
  <div class="flex bg-slate-200/80 p-1 rounded-xl gap-1 text-xs font-medium border border-slate-300/40">
    <button id="btn-show-map" class="px-3 py-1.5 rounded-lg flex items-center gap-1.5 bg-white text-emerald-900 font-semibold shadow-sm transition">
      🗺️ <span>Karta</span>
    </button>
    <button id="btn-show-list" class="px-3 py-1.5 rounded-lg flex items-center gap-1.5 text-slate-600 hover:text-slate-900 transition">
      📋 <span>Lista</span>
      <span class="marker-count-val ml-0.5 bg-emerald-600 text-white text-[10px] px-1.5 py-0.2 rounded-full font-bold">0</span>
    </button>
  </div>

  <button id="btn-mark" class="px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white text-xs font-semibold rounded-xl shadow-sm flex items-center gap-1.5 transition">
    <span>📍</span> Markera position
  </button>
</div>


<!-- Main View Area -->
<div class="relative flex-1 overflow-hidden">

    <!-- 1. KARTVY -->
    <div id="map-view" class="w-full h-full relative">
        <!-- Kartväljare Meny -->
        <div class="absolute top-3 left-3 z-[400] flex flex-col items-start gap-2">
            <button id="map-selector-toggle" class="bg-white/95 backdrop-blur border border-slate-200 text-slate-800 px-3 py-1.5 rounded-full shadow text-xs font-bold flex items-center gap-1.5 hover:bg-slate-50 transition">
                <span>🥞 🌲</span>
                <span id="current-map-name">Skogstopo</span>
                <span class="text-[10px] text-slate-400">▼</span>
            </button>

            <!-- Dropdown Meny -->
            <div id="map-selector-menu" class="hidden bg-white/95 backdrop-blur border border-slate-200 rounded-2xl p-2 shadow-xl flex flex-col gap-1.5 w-52 transition">
                <button data-tile="topo" class="map-option-btn p-2 rounded-xl flex items-center gap-3 hover:bg-slate-100 text-left transition border border-emerald-500 bg-emerald-50/50">
                    <span class="text-xl">🌲</span>
                    <div>
                        <div class="font-bold text-xs text-slate-800">Skogstopo</div>
                        <div class="text-[10px] text-slate-500">Höjdkurvor & stigar</div>
                    </div>
                </button>

                <button data-tile="satellite" class="map-option-btn p-2 rounded-xl flex items-center gap-3 hover:bg-slate-100 text-left transition border border-transparent">
                    <span class="text-xl">🛰️</span>
                    <div>
                        <div class="font-bold text-xs text-slate-800">Satellitvy</div>
                        <div class="text-[10px] text-slate-500">Esri flygfoton</div>
                    </div>
                </button>

                <button data-tile="osm" class="map-option-btn p-2 rounded-xl flex items-center gap-3 hover:bg-slate-100 text-left transition border border-transparent">
                    <span class="text-xl">🗺️</span>
                    <div>
                        <div class="font-bold text-xs text-slate-800">Standardkarta</div>
                        <div class="text-[10px] text-slate-500">Vägar & översikt</div>
                    </div>
                </button>
            </div>
        </div>

        <!-- Själva Kartan -->
        <div id="map" class="z-0"></div>

        <!-- Floating Buttons Right -->
        <div class="absolute top-3 right-3 z-[400] flex flex-col gap-2">
            <button id="btn-recenter" class="w-10 h-10 bg-white rounded-2xl shadow flex items-center justify-center text-blue-600 border border-slate-200 font-bold text-lg" title="Centrera på min position">
                🎯
            </button>
        </div>

        <!-- Map Overlay Bottom Footer -->
        <div class="absolute bottom-4 left-3 z-[400] bg-white/90 backdrop-blur px-3 py-1.5 rounded-full shadow text-xs font-medium text-slate-700 flex items-center gap-2 border border-slate-200">
            <span class="flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                <strong><span class="marker-count-val">0</span> platser</strong> på kartan
            </span>
            <span class="text-slate-300">|</span>
            <span id="gps-accuracy-footer">GPS: Söker...</span>
        </div>
    </div>

    <!-- 2. LISTVY -->
    <div id="list-view" class="hidden w-full h-full p-4 overflow-y-auto bg-slate-50">
        <div id="list-container" class="max-w-md mx-auto"></div>
    </div>

</div>

<!-- Modal: Markera denna plats -->
<div id="save-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[1000] hidden flex items-end sm:items-center justify-center p-0 sm:p-4 transition-opacity">
    <div class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">

        <div class="bg-emerald-800 text-white p-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="text-2xl">🍄</span>
                <div>
                    <h2 class="font-bold text-base leading-tight">Markera denna plats</h2>
                    <p class="text-xs text-emerald-200">GPS-koordinater och information sparas</p>
                </div>
            </div>
            <button id="modal-close" class="w-8 h-8 rounded-full bg-emerald-900/50 hover:bg-emerald-900 flex items-center justify-center text-white text-lg font-bold">
                ✕
            </button>
        </div>

        <div class="p-4 overflow-y-auto space-y-5 flex-1 text-slate-800 text-xs">
            <div class="bg-slate-50 border border-slate-200 p-3 rounded-2xl flex items-center justify-between">
                <div class="space-y-0.5">
                    <div class="font-mono text-sm font-semibold text-slate-800 flex items-center gap-2">
                        <span id="modal-coords">00.000000, 00.000000</span>
                        <span id="modal-accuracy" class="bg-emerald-100 text-emerald-800 font-sans text-[10px] px-1.5 py-0.5 rounded-full font-bold">±3m</span>
                    </div>
                    <p class="text-[11px] text-slate-500">WGS84 GPS-koordinater</p>
                </div>
            </div>

            <div>
                <label class="block font-bold text-slate-500 uppercase tracking-wider text-[10px] mb-2">VAD FINNS PÅ PLATSEN?</label>
                <div id="category-grid" class="grid grid-cols-3 gap-2"></div>
            </div>

            <div>
                <label class="block font-bold text-slate-500 uppercase tracking-wider text-[10px] mb-1.5">NAMN / RUBRIK PÅ PLATSEN</label>
                <input type="text" id="input-title" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-medium focus:outline-none focus:border-emerald-600 focus:bg-white transition" placeholder="t.ex. Gula kantareller i mossig skog">
            </div>

            <div>
                <label class="block font-bold text-slate-500 uppercase tracking-wider text-[10px] mb-1.5">MÄNGD / BESTÅND</label>
                <div id="amount-selector" class="grid grid-cols-2 gap-2">
                    <button data-amount="Rikligt med fynd" class="amount-btn py-2.5 px-3 rounded-xl border border-emerald-600 bg-emerald-50 text-emerald-800 font-bold text-xs flex items-center justify-center gap-1">✨ Rikligt med fynd</button>
                    <button data-amount="Mellanstort bestånd" class="amount-btn py-2.5 px-3 rounded-xl border border-slate-200 bg-white text-slate-700 font-semibold text-xs flex items-center justify-center gap-1">🌱 Mellanstort bestånd</button>
                    <button data-amount="Enstaka exemplar" class="amount-btn py-2.5 px-3 rounded-xl border border-slate-200 bg-white text-slate-700 font-semibold text-xs flex items-center justify-center gap-1">🌿 Enstaka exemplar</button>
                    <button data-amount="Utforska senare" class="amount-btn py-2.5 px-3 rounded-xl border border-slate-200 bg-white text-slate-700 font-semibold text-xs flex items-center justify-center gap-1">🔍 Utforska senare</button>
                </div>
            </div>

            <div>
                <label class="block font-bold text-slate-500 uppercase tracking-wider text-[10px] mb-1.5">ANTECKNINGAR & TIPS (VALFRITT)</label>
                <textarea id="input-notes" rows="2" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs focus:outline-none focus:border-emerald-600 focus:bg-white transition" placeholder="t.ex. Växer under gamla granar, bäst att besöka efter regn..."></textarea>
            </div>

            <div class="mt-3">
                <label class="block text-xs font-semibold text-slate-600 mb-1">📷 Ta foto / Välj bild</label>
                <div class="flex items-center gap-2">
                    <label class="flex-1 flex items-center justify-center gap-2 bg-slate-100 border border-slate-200 text-slate-700 py-2.5 px-3 rounded-2xl cursor-pointer hover:bg-slate-200 transition text-xs font-medium">
                        <span>📷 Ta bild med kameran</span>
                        <input type="file" id="input-photo" accept="image/*" capture="environment" class="hidden">
                    </label>
                </div>
                <div id="photo-preview-container" class="mt-2 hidden">
                    <img id="photo-preview" src="" alt="Förhandsgranskning" class="w-full h-32 object-cover rounded-xl border border-slate-200">
                </div>
            </div>
        </div>

        <div class="p-3 bg-slate-50 border-t border-slate-200 flex items-center justify-between">
            <span class="text-[11px] text-slate-500 font-medium">GPS: <strong id="modal-footer-gps" class="text-slate-700">±3m</strong></span>
            <button id="btn-save-confirm" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs py-3 px-5 rounded-2xl shadow-md flex items-center gap-2">
                📍 Markera & Spara plats
            </button>
        </div>
    </div>
</div>

</body>
</html>
